  <!-- ================= JAVASCRIPT APP LOGIC ================= -->
  <script>
    // --- 1. SAP SUCCESSFACTORS LMS SCORM 1.2 / 2004 WRAPPER ---
    const scorm = {
      api: null,
      isInitialized: false,
      isScorm2004: false,
      startTime: new Date(),
      
      findAPI(win) {
        let attempts = 0;
        let currentWin = win;
        while (currentWin && !currentWin.API && !currentWin.API_1484_11 && attempts < 10) {
          if (currentWin.parent && currentWin.parent !== currentWin) {
            currentWin = currentWin.parent;
          } else if (currentWin.opener) {
            currentWin = currentWin.opener;
          } else {
            break;
          }
          attempts++;
        }
        return currentWin ? (currentWin.API || currentWin.API_1484_11 || null) : null;
      },

      init() {
        this.api = this.findAPI(window);
        if (this.api) {
          this.isScorm2004 = !!window.API_1484_11 || (this.api.Initialize !== undefined);
          const res = this.isScorm2004 ? this.api.Initialize("") : this.api.LMSInitialize("");
          if (res === "true" || res === true) {
            this.isInitialized = true;
            console.log("[SAP LMS] Handshake SCORM Initialized successfully!");
            
            // Read learner name
            const studentName = this.getValue(this.isScorm2004 ? "cmi.learner_name" : "cmi.core.student_name");
            if (studentName) {
              const uLabel = document.getElementById('sidebarLmsUser');
              if (uLabel) uLabel.innerText = "Learner: " + studentName;
            }

            // Set initial status to incomplete
            const curStatus = this.getValue(this.isScorm2004 ? "cmi.completion_status" : "cmi.core.lesson_status");
            if (!curStatus || curStatus === "not attempted" || curStatus === "unknown") {
              this.setValue(this.isScorm2004 ? "cmi.completion_status" : "cmi.core.lesson_status", "incomplete");
              this.commit();
            }

            // Update UI tags
            document.getElementById('lmsStatusLabel').innerText = "SAP Connected";
            document.getElementById('sidebarLmsBadge').innerText = this.isScorm2004 ? "SCORM 2004" : "SCORM 1.2";
          }
        } else {
          console.log("[SAP LMS] No LMS parent detected. Running in Standalone / Preview Mode.");
        }
      },

      getValue(key) {
        if (!this.isInitialized) return "";
        return this.isScorm2004 ? this.api.GetValue(key) : this.api.LMSGetValue(key);
      },

      setValue(key, val) {
        if (!this.isInitialized) return;
        if (this.isScorm2004) {
          this.api.SetValue(key, String(val));
        } else {
          this.api.LMSSetValue(key, String(val));
        }
      },

      commit() {
        if (!this.isInitialized) return;
        if (this.isScorm2004) {
          this.api.Commit("");
        } else {
          this.api.LMSCommit("");
        }
      },

      saveProgress(unitId, score = null, passed = false) {
        if (!this.isInitialized) return;
        // Bookmark location
        this.setValue(this.isScorm2004 ? "cmi.location" : "cmi.core.lesson_location", String(unitId));
        
        // Score if evaluated
        if (score !== null) {
          if (this.isScorm2004) {
            this.setValue("cmi.score.raw", score);
            this.setValue("cmi.score.min", 0);
            this.setValue("cmi.score.max", 100);
            this.setValue("cmi.score.scaled", score / 100);
          } else {
            this.setValue("cmi.core.score.raw", score);
            this.setValue("cmi.core.score.min", "0");
            this.setValue("cmi.core.score.max", "100");
          }
        }

        // Completion / Success status
        if (passed) {
          if (this.isScorm2004) {
            this.setValue("cmi.completion_status", "completed");
            this.setValue("cmi.success_status", "passed");
          } else {
            this.setValue("cmi.core.lesson_status", "passed");
          }
        }
        this.commit();
      },

      finish() {
        if (!this.isInitialized) return;
        // Compute session time in format HH:MM:SS
        const now = new Date();
        const diffSec = Math.floor((now - this.startTime) / 1000);
        const h = String(Math.floor(diffSec / 3600)).padStart(2, '0');
        const m = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
        const s = String(diffSec % 60).padStart(2, '0');
        const timeStr = `${h}:${m}:${s}`;

        if (this.isScorm2004) {
          this.setValue("cmi.session_time", `PT${h}H${m}M${s}S`);
          this.api.Terminate("");
        } else {
          this.setValue("cmi.core.session_time", timeStr);
          this.api.LMSFinish("");
        }
        this.isInitialized = false;
      }
    };

    window.addEventListener('beforeunload', () => scorm.finish());
    window.addEventListener('unload', () => scorm.finish());

    // --- 2. AUDIO & SFX SYNTHESIZER (ZERO EXTERNAL DEPENDENCY) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.04);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } else if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(783.99, now + 0.16);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.linearRampToValueAtTime(130, now + 0.14);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      } else if (type === 'fanfare') {
        [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'triangle';
          o.frequency.value = f;
          g.gain.setValueAtTime(0.16, now + idx * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(now + idx * 0.08);
          o.stop(now + idx * 0.08 + 0.4);
        });
      }
    }

    // --- 3. COURSE UNITS SPECIFICATION (11 UNITS) ---
    const UNITS = [
      {
        id: 0,
        title: "Cover & Orientasi Kepemimpinan",
        badge: "Orientasi",
        audioSrc: "audio/unit_00.mp3",
        reqTask: false,
        timerSec: 5,
        render: () => `
          <div class="space-y-6">
            <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-spike-blue-light border border-spike-blue-border text-spike-blue font-extrabold text-xs">
              <span class="w-2 h-2 rounded-full bg-spike-blue animate-pulse"></span>
              <span>DIGITAL LEADERSHIP PROGRAM • SESI 6 &amp; 7</span>
            </div>
            
            <h1 class="text-3xl sm:text-5xl font-extrabold text-spike-black tracking-tight leading-tight">
              Problem Solving &amp; Decision Making
            </h1>
            
            <p class="text-sm sm:text-base text-[#555555] leading-relaxed max-w-3xl">
              <em>Navigasi Ketidakpastian: Dari Pemadam Kebakaran Menjadi Pemimpin Berbasis Data.</em> Saat beralih menjadi seorang leader, Anda bukan lagi sekadar memadamkan api masalah kecil sendirian. Tugas utama Anda adalah menuntun tim membedah akar masalah terdalam dan mengambil keputusan tangguh berbasis data.
            </p>

            <!-- 5 Steps Architecture Matrix (Spike Style Pill Cards) -->
            <div class="grid grid-cols-1 sm:grid-cols-5 gap-3 pt-2">
              <div class="p-3.5 bg-spike-gray rounded-2xl border border-[#E5E5E5] hover:border-spike-blue transition">
                <span class="text-xs font-mono font-extrabold text-spike-blue block">01</span>
                <span class="text-xs font-extrabold text-spike-black mt-1 block">Identifikasi Masalah</span>
                <span class="text-[11px] text-[#666666]">Iceberg &amp; 5W2H</span>
              </div>
              <div class="p-3.5 bg-spike-gray rounded-2xl border border-[#E5E5E5] hover:border-spike-blue transition">
                <span class="text-xs font-mono font-extrabold text-spike-blue block">02</span>
                <span class="text-xs font-extrabold text-spike-black mt-1 block">Analisa Sebab</span>
                <span class="text-[11px] text-[#666666]">Fishbone &amp; 5-Whys</span>
              </div>
              <div class="p-3.5 bg-spike-gray rounded-2xl border border-[#E5E5E5] hover:border-spike-crimson transition">
                <span class="text-xs font-mono font-extrabold text-spike-crimson block">03</span>
                <span class="text-xs font-extrabold text-spike-black mt-1 block">Prioritas Solusi</span>
                <span class="text-[11px] text-[#666666]">2x2 Impact-Effort</span>
              </div>
              <div class="p-3.5 bg-spike-gray rounded-2xl border border-[#E5E5E5] hover:border-spike-crimson transition">
                <span class="text-xs font-mono font-extrabold text-spike-crimson block">04</span>
                <span class="text-xs font-extrabold text-spike-black mt-1 block">Corrective Action</span>
                <span class="text-[11px] text-[#666666]">Contain vs Prevent</span>
              </div>
              <div class="p-3.5 bg-spike-gray rounded-2xl border border-[#E5E5E5] hover:border-spike-black transition">
                <span class="text-xs font-mono font-extrabold text-spike-black block">05</span>
                <span class="text-xs font-extrabold text-spike-black mt-1 block">Feedback Loop</span>
                <span class="text-[11px] text-[#666666]">PDCA Telemetri</span>
              </div>
            </div>

            <!-- Profile & CTA -->
            <div class="flex flex-wrap items-center justify-between gap-4 p-5 rounded-2xl bg-spike-black text-white mt-4 shadow-lg">
              <div class="text-xs text-slate-300 space-y-0.5">
                <span class="font-extrabold text-white text-sm block">Sasaran: First-time Lead / Supervisor / Manager (≤ 2 Tahun)</span>
                <span>Standar Kelulusan: Skor Minimum 80% • Siap Ekspor ke SAP SuccessFactors</span>
              </div>
              <button onclick="navigateUnit(1)" class="px-6 py-2.5 rounded-full bg-spike-crimson hover:bg-spike-crimson-dark text-white font-extrabold text-xs shadow-md transition flex items-center gap-2 active:scale-95">
                <span>Mulai Pembelajaran Unit 1</span>
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
              </button>
            </div>
          </div>
        `
      },
      {

        state.completedUnits.add(unit.id);
        btnNext.disabled = false;
        updateSidebarUI();
        scorm.saveProgress(unit.id);
      }
    }

        const dur = audioEl.duration || 1;
        document.getElementById('audioCurrentTime').innerText = formatTime(cur);
        document.getElementById('audioTotalDuration').innerText = formatTime(dur);
        const pct = (cur / dur) * 100;
        document.getElementById('audioProgressBar').style.width = `${pct}%`;
      });

      audioEl.addEventListener('ended', () => {
        updateAudioControlsUI(false);
      });
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function toggleAudio() {

    }

      const p = document.getElementById('iconPlay');
      const s = document.getElementById('iconPause');
      if (isPlaying) {
        p.classList.add('hidden');
        s.classList.remove('hidden');
      } else {
        p.classList.remove('hidden');
        s.classList.add('hidden');
      }
    }

    function replayAudio() {
      audioEl.currentTime = 0;
      audioEl.play().then(() => updateAudioControlsUI(true));
      playTone('click');
    }

    function seekAudio(e) {
      const bar = e.currentTarget;
      const rect = bar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      audioEl.currentTime = pct * audioEl.duration;

        fb.innerHTML = "🏆 <strong>Keputusan Sempurna (+20 Poin):</strong> Anda menenangkan tim, mengisolasi dampak ke klien (Containment), dan menggunakan data log error untuk memecahkan akar masalah bersama tanpa saling menyalahkan.";
        markTaskDone(8);
      } else if (choice === 'B') {
        playTone('error');
        document.getElementById('teamMoodMeter').innerText = "Panik Meluas (20%)";
        document.getElementById('teamMoodMeter').className = "text-xs font-mono font-bold text-spike-crimson bg-spike-crimson-light px-3 py-0.5 rounded-full border border-spike-crimson-border";
        fb.className = "p-4 rounded-2xl text-xs leading-relaxed bg-spike-crimson-light border border-spike-crimson-border text-spike-black";
        fb.innerHTML = "❌ <strong>Jebakan Action Bias (-15 Poin):</strong> Kepanikan Anda membuat tim tertekan dan ketakutan melapor. Rollback tanpa analisis sering kali menyebabkan downtime lebih panjang.";
      } else {
        playTone('error');
        document.getElementById('teamMoodMeter').innerText = "Bingung & Pasif (30%)";
        document.getElementById('teamMoodMeter').className = "text-xs font-mono font-bold text-amber-800 bg-amber-50 px-3 py-0.5 rounded-full border border-amber-200";
        fb.className = "p-4 rounded-2xl text-xs leading-relaxed bg-amber-50 border border-amber-200 text-amber-950";
        fb.innerHTML = "⚠️ <strong>Analysis Paralysis (-20 Poin):</strong> Menunggu berjam-jam tanpa melakukan containment membuat kerugian klien enterprise semakin membesar.";
      }
    }

    // Unit 9: Quiz Evaluation & SAP LMS SCORM Pass Event
    function submitQuizOption(choice) {
      const fb = document.getElementById('quizFeedbackBox');
      fb.classList.remove('hidden');

      if (choice === 'D') {
        playTone('fanfare');
        if (typeof confetti === 'function') {
          confetti({ particleCount: 90, spread: 80, origin: { y: 0.6 } });
        }
        fb.className = "p-4 rounded-2xl text-xs leading-relaxed bg-emerald-50 border border-emerald-300 text-emerald-950 space-y-1";
        fb.innerHTML = "🎉 <strong>Benar Mutlak! (Skor: 100/100 - LULUS):</strong><br>Opsi D menggabungkan data kuantitatif, wawasan kualitatif dari pengguna churn, hipotesis akar masalah, serta validasi A/B testing berisiko rendah sebelum rilis massal.";
        state.quizPassed = true;
        markTaskDone(9);
        
        // Push 100 score & Passed status to SAP SuccessFactors
        scorm.saveProgress(9, 100, true);
      } else {
        playTone('error');
        fb.className = "p-4 rounded-2xl text-xs leading-relaxed bg-spike-crimson-light border border-spike-crimson-border text-spike-black space-y-1";
        fb.innerHTML = "❌ <strong>Kurang Tepat:</strong> Opsi ini mengabaikan prinsip mitigasi risiko dan pengujian berbasis data. Silakan evaluasi kembali dan pilih opsi D.";
      }
    }

    // Unit 10: Toolkit Download Action
    function downloadCanvasToolkit() {
      playTone('success');
      const text = `PROBLEM SOLVING & DECISION MAKING CANVAS\n\n1. PERNYATAAN MASALAH (5W2H):\n[Isi pernyataan masalah yang faktual, terukur, dan netral]\n\n2. INVESTIGASI 5-WHYS:\n- Mengapa 1:\n- Mengapa 2:\n- Mengapa 3:\n- Mengapa 4:\n- Mengapa 5 (Root Cause):\n\n3. PRIORITAS SOLUSI (IMPACT VS EFFORT):\n- Quick Wins:\n- Major Projects:\n\n4. RENCANA AKSI KOREKTIF:\n- Containment (Jam):\n- Corrective (Minggu):\n- Preventive (Sistemik):\n\n5. SIKLUS SPRINT PDCA:\n- Hipotesis Plan:\n- Do (Sprint 1-2 minggu):\n- Check (Metrik Telemetri):\n- Act (Adapt / Persevere):`;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Problem_Solving_Canvas_Template.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Initialize when page loads
    window.addEventListener('DOMContentLoaded', init);
  </script>
